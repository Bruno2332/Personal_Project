name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS - ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: apple-silicon
            runner: macos-15
            target: aarch64-apple-darwin

          - architecture: intel
            runner: macos-15-intel
            target: x86_64-apple-darwin

    env:
      CARGO_TERM_COLOR: always
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-${{ matrix.target }}

      - name: Instalar dependências do frontend
        run: yarn install --frozen-lockfile

      - name: Compilar aplicativo e gerar DMG
        run: >
          ./node_modules/.bin/tauri build
          --target ${{ matrix.target }}
          --bundles dmg
          -- --locked

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: personal-trainer-macos-${{ matrix.architecture }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0