[package]
name = "personal_trainer_project"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "personal_trainer_project_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
    "regexp"
] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
unicode-normalization = "0.1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
libsqlite3-sys = { version = "0.37", default-features = false, features = [
    "bundled-sqlcipher-vendored-openssl"
] }
validator = { version = "0.21", features = ["derive"] }

keyring = { version = "3.6.3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust"
] }

hex = "0.4"
age = "0.11.1"
tempfile = "3"
async-trait = "0.1.92"
mockall = "0.15.0"
aes-gcm = "0.11.1"
aead = "0.5.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
